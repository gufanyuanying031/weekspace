<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-label="随心安排：任务模板可重复拖到不同日期，每次生成独立任务">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b746e"/></marker></defs>
<rect width="1120" height="530" rx="24" fill="#f7f7f2"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" fill="#1a1c1a">
<text x="48" y="58" font-size="14" letter-spacing="3">W E E K S P A C E · 周间</text>
<text x="48" y="108" font-size="32" font-weight="500">先收下想法，再拖进生活。</text>
<rect x="48" y="146" width="300" height="322" rx="16" fill="#fff" stroke="#e3e5df"/>
<text x="70" y="184" font-size="18" font-weight="500">随心安排</text><text x="70" y="209" font-size="12" fill="#777c76">不用马上决定，先放在这里。</text>
<rect x="68" y="232" width="260" height="54" rx="9" fill="#edf2ec" stroke="#cad7ca"/>
<text x="84" y="264" font-size="15" fill="#728075">≡</text><text x="111" y="264" font-size="16">阅读 20 分钟</text>
<rect x="68" y="298" width="260" height="50" rx="9" fill="#f7f7f3"/><text x="84" y="328" font-size="15" fill="#999f98">≡</text><text x="111" y="328" font-size="15">出门走走</text>
<rect x="68" y="360" width="260" height="50" rx="9" fill="#f7f7f3"/><text x="84" y="390" font-size="15" fill="#999f98">≡</text><text x="111" y="390" font-size="15">整理灵感</text>
<text x="70" y="442" font-size="12" fill="#7e857b">模板保留 · 可以重复使用</text>
<path d="M 344 257 C 422 257 413 226 486 226" stroke="#6b746e" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
<path d="M 344 266 C 427 266 409 373 486 373" stroke="#6b746e" stroke-width="1.6" fill="none" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
<rect x="510" y="146" width="562" height="148" rx="15" fill="#fff" stroke="#e3e5df"/><text x="534" y="180" font-size="12" fill="#777c76">周二 · 上午</text>
<circle cx="545" cy="227" r="9" stroke="#9ca69b" fill="none" stroke-width="1.3"/><text x="568" y="233" font-size="18">阅读 20 分钟</text><text x="1016" y="232" font-size="14" fill="#9ca69b">···</text>
<rect x="510" y="316" width="562" height="148" rx="15" fill="#fff" stroke="#e3e5df"/><text x="534" y="350" font-size="12" fill="#777c76">周五 · 晚上</text>
<circle cx="545" cy="397" r="9" stroke="#9ca69b" fill="none" stroke-width="1.3"/><text x="568" y="403" font-size="18">阅读 20 分钟</text><text x="1016" y="402" font-size="14" fill="#9ca69b">···</text>
<text x="510" y="496" font-size="12" fill="#777c76">同一个想法，不同的时刻。每次安排，独立完成。</text>
</g></svg>
